<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Is Everybody?</title>
<meta name="description" content="The Fermi Paradox in about a minute, explained by a cat who may or may not be in this box. Pure JavaScript: no libraries, no images, no audio files.">
<style>
  html, body { margin: 0; height: 100%; background: #1b1712; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  canvas { display: block; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55); cursor: pointer; }
  #ui {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 9vh; gap: 12px; pointer-events: none; transition: opacity 400ms ease;
  }
  #ui.is-hidden { opacity: 0; }
  #ui.is-hidden button { pointer-events: none; }
  #play {
    pointer-events: auto; cursor: pointer; font: inherit; font-size: clamp(17px, 2.2vw, 24px);
    padding: 14px 30px; border-radius: 999px; border: 2px solid #2a211b; background: #fbf3e1; color: #2a211b;
    box-shadow: 4px 6px 0 rgba(42, 33, 27, 0.85); transform: rotate(-1.5deg); transition: transform 160ms ease;
  }
  #play:hover { transform: rotate(0deg) scale(1.04); }
  #play:disabled { opacity: 0.7; cursor: progress; }
  #note { margin: 0; color: rgba(251, 243, 225, 0.8); font-style: italic; font-size: 15px; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<canvas id="c" aria-label="An animated film: Where is everybody? The Fermi Paradox, explained by a cat."></canvas>
<div id="ui">
  <button id="play">▶&nbsp; play, with sound</button>
  <p id="note">about a minute · click the picture to pause · R to start again</p>
</div>
<script src="fermi.js"></script>
</body>
</html>
