<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Sindoor, explained</title>
<meta name="description" content="A three-minute animated explainer on Operation Sindoor: the Pahalgam attack, India's strikes of 7 May 2025, the four days that followed and the ceasefire. Pure JavaScript.">
<style>
  html, body { margin: 0; height: 100%; background: #1c1b19; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif; }
  canvas { display: block; cursor: pointer; }
  #ui {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 4vh; gap: 10px; pointer-events: none; transition: opacity 500ms ease;
  }
  #ui.is-hidden { opacity: 0; }
  #ui.is-hidden button { pointer-events: none; }
  button {
    pointer-events: auto; cursor: pointer; font: inherit; font-size: clamp(15px, 1.8vw, 20px); font-weight: 700; letter-spacing: 0.04em;
    padding: 12px 28px; border-radius: 4px; border: 0; background: #ffd83d; color: #1c1b19; box-shadow: 0 6px 0 rgba(0,0,0,0.25);
  }
  button:hover { background: #ffe57a; }
  button:disabled { opacity: 0.6; cursor: progress; }
  #note { margin: 0; color: #1c1b19; background: rgba(242, 237, 226, 0.9); padding: 4px 10px; font-size: 13px; }
  #bar { position: fixed; bottom: 0; height: 6px; background: rgba(255, 255, 255, 0.12); cursor: pointer; }
  #bar:hover { height: 10px; }
  #fill { height: 100%; width: 0; background: #d3241c; }
  #credit { position: fixed; left: 14px; top: 10px; margin: 0; color: rgba(242, 237, 226, 0.4); font-size: 11px; }
</style>
</head>
<body>
<canvas id="c" data-poster="12.5" aria-label="An animated explainer about Operation Sindoor, India's strikes on Pakistan in May 2025, with maps, timelines and the claims of both governments."></canvas>
<div id="ui">
  <button id="play">▶&nbsp; watch, with sound</button>
  <p id="note">3 min 10 s · click the picture to pause · ← → to skip · R to start again</p>
</div>
<div id="bar"><div id="fill"></div></div>
<p id="credit">An explainer from the public record. Where India and Pakistan disagree, it says who claimed what. Map: Natural Earth; boundaries schematic.</p>
<script src="region.js"></script>
<script src="sindoor.js" data-global="SINDOOR"></script>
</body>
</html>
