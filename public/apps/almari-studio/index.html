<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f5f2}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Almari Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Young+Serif&display=swap">
<style>
/* Layout: a joiner's bench. Tool rail, the job sheet (panel) and the piece itself (stage); the finish library slides in like a shade card. */
:root {
  --bg: #e9ece8;
  --panel: #fafbf9;
  --sunk: #e0e4df;
  --ink: #1b201e;
  --muted: #59635e;
  --line: #cdd3ce;
  --accent: #86652a;
  --accent-ink: #ffffff;
  --accent-soft: rgba(134, 101, 42, 0.12);
  --warn: #a2421a;
  --warn-soft: rgba(162, 66, 26, 0.1);
  --ok: #2c6a49;
  --stage: #d6dad4;
  --shadow: 0 10px 40px rgba(20, 30, 25, 0.18);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111413; --panel: #191d1b; --sunk: #222725; --ink: #e6eae7; --muted: #99a39e; --line: #313834;
    --accent: #d6ad58; --accent-ink: #1b1407; --accent-soft: rgba(214, 173, 88, 0.14);
    --warn: #ec8f60; --warn-soft: rgba(236, 143, 96, 0.12); --ok: #73c69b; --stage: #0d100f;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111413; --panel: #191d1b; --sunk: #222725; --ink: #e6eae7; --muted: #99a39e; --line: #313834;
  --accent: #d6ad58; --accent-ink: #1b1407; --accent-soft: rgba(214, 173, 88, 0.14);
  --warn: #ec8f60; --warn-soft: rgba(236, 143, 96, 0.12); --ok: #73c69b; --stage: #0d100f;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.5); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-inline: 16px; padding-block: 0 12px; gap: 10px; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 10px 0; }
.brand { font-family: var(--f-display); font-size: 21px; letter-spacing: 0.01em; white-space: nowrap; }
.brand small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; letter-spacing: 0.04em; }
#dname { flex: 1 1 160px; min-width: 0; max-width: 320px; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; font-weight: 500; }
#dname:hover, #dname:focus { border-color: var(--line); background: var(--panel); }
.tb { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 11px; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.small { padding: 4px 8px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.work { display: grid; grid-template-columns: 64px minmax(300px, 360px) minmax(0, 1fr); gap: 10px; min-height: 0; }
.rail { display: flex; flex-direction: column; gap: 4px; }
.rail button { border: 0; background: transparent; border-radius: 8px; padding: 8px 2px 6px; display: grid; justify-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); letter-spacing: 0.02em; }
.rail button svg { width: 22px; height: 22px; }
.rail button:hover { background: var(--sunk); color: var(--ink); }
.rail button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.rail button[aria-selected="true"] svg { color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; padding: 14px 14px 22px; min-width: 0; }
.panel h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0 0 2px; text-wrap: balance; }
.panel .lede { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
.panel h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.field label { font-size: 13px; }
.field .hint { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
.num { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); overflow: hidden; }
.num input { width: 74px; border: 0; background: transparent; padding: 5px 4px 5px 8px; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num span { padding: 0 8px 0 2px; color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
.num button { border: 0; background: var(--sunk); width: 26px; align-self: stretch; }
select.sel { border: 1px solid var(--line); border-radius: 7px; background: var(--bg); padding: 5px 8px; max-width: 100%; }
.check { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.grid-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.pick { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 8px 6px 7px; display: grid; justify-items: center; gap: 4px; font-size: 12px; text-align: center; line-height: 1.2; }
.pick svg { width: 54px; height: 54px; color: var(--ink); }
.pick:hover { border-color: var(--muted); }
.pick[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.note { font-size: 12.5px; color: var(--muted); background: var(--sunk); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
.warnlist { display: grid; gap: 6px; margin: 8px 0; }
.warn { font-size: 12.5px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 7px 10px; }
.okmsg { font-size: 12.5px; color: var(--ok); }

/* material slots */
.slot { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.slot canvas, .sw { width: 46px; height: 46px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); display: block; }
.slot b { display: block; font-weight: 500; font-size: 13px; }
.slot .meta { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combo { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 0; overflow: hidden; text-align: left; display: grid; }
.combo .bars { display: flex; height: 54px; }
.combo .bars canvas { flex: 1; min-width: 0; height: 54px; display: block; }
.combo span { padding: 6px 8px 7px; font-size: 12px; line-height: 1.25; }
.combo span small { display: block; color: var(--muted); font-size: 11px; }
.combo:hover { border-color: var(--muted); }

/* interior editor */
.bays { display: flex; gap: 6px; flex-wrap: wrap; }
.bay-chip { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; display: grid; text-align: left; line-height: 1.2; }
.bay-chip small { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.bay-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mods { display: grid; gap: 6px; margin-top: 8px; }
.mod { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-areas: "ic nm acts" "ic ctl ctl"; align-items: center; gap: 4px 8px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
.mod > svg { grid-area: ic; align-self: start; } .mod .nm { grid-area: nm; } .mod .acts { grid-area: acts; } .mod .num { grid-area: ctl; justify-self: start; }
.mod svg { width: 28px; height: 28px; color: var(--muted); }
.mod .nm { font-size: 13px; line-height: 1.2; }
.mod .nm small { display: block; color: var(--muted); font-size: 11px; }
.mod .acts { display: flex; gap: 2px; }
.mod .acts button { border: 0; background: transparent; width: 24px; height: 24px; border-radius: 5px; color: var(--muted); }
.mod .acts button:hover { background: var(--sunk); color: var(--ink); }
.mod.sel { border-color: var(--accent); }
.free { font-size: 12px; font-family: var(--f-mono); padding: 6px 8px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.free.bad { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.addgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.addgrid button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 4px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; line-height: 1.15; }
.addgrid button svg { width: 30px; height: 30px; color: var(--ink); }
.addgrid button small { color: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.addgrid button:hover { border-color: var(--accent); }

/* stage */
.stage { position: relative; border-radius: 10px; overflow: hidden; background: var(--stage); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; border: 1px solid var(--line); }
.stagebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.stagebar .grow { flex: 1; }
.stagebar label.rng { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.stagebar input[type=range] { width: 110px; accent-color: var(--accent); }
.view { position: relative; min-height: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#elev { position: absolute; inset: 0; overflow: auto; display: grid; place-items: center; padding: 10px; }
#elev svg { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
.selinfo { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; max-width: calc(100% - 20px); box-shadow: var(--shadow); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.brushbar { position: absolute; right: 10px; top: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 20px); }
.brushbar canvas { width: 26px; height: 26px; border-radius: 5px; }
.brushbar button { border: 0; background: rgba(0,0,0,0.2); color: inherit; border-radius: 6px; padding: 3px 8px; }
.stagefoot { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.stagefoot .w { color: var(--warn); }
.dims { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); }

/* library */
.lib { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--panel); box-shadow: var(--shadow); z-index: 50; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; border-left: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lib-head { padding: 12px 16px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.lib-head .t { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lib-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; }
.lib-head .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lib-head .x { margin-left: auto; }
.lib-search { display: flex; gap: 8px; flex-wrap: wrap; }
.lib-search input[type=search] { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--bg); }
.lib-filters { padding: 8px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); max-height: 34vh; overflow: auto; }
.lib-filters .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.fam { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; flex: none; }
.fam[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.lib-grid { overflow: auto; padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; align-content: start; }
.swc { border: 1px solid transparent; background: transparent; padding: 0; border-radius: 9px; text-align: left; display: grid; gap: 4px; position: relative; }
.swc canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; display: block; background: var(--sunk); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
.swc .n { font-size: 12px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding: 0 2px; }
.swc .c { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; padding: 0 2px 2px; }
.swc .c i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2); }
.swc[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.swc .fav { position: absolute; top: 5px; right: 5px; font-size: 13px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.lib-more { grid-column: 1 / -1; justify-self: center; }
.lib-empty { grid-column: 1 / -1; color: var(--muted); padding: 30px 0; text-align: center; }
.lib-detail { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; max-height: 46vh; overflow: auto; }
.lib-detail .big { width: 132px; height: 132px; border-radius: 9px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.lib-detail h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 18px; line-height: 1.2; }
.lib-detail .kv { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.lib-detail .kv b { color: var(--ink); font-weight: 500; }
.applies { display: flex; flex-wrap: wrap; gap: 6px; }
.pairs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.pairs button { border: 0; padding: 0; background: none; display: grid; gap: 2px; width: 54px; font-size: 10px; color: var(--muted); text-align: left; line-height: 1.15; }
.pairs canvas { width: 54px; height: 54px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }

/* overlays */
.ov { position: fixed; inset: 0; background: rgba(10, 14, 12, 0.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
.dlg { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: 86vh; overflow: auto; padding: 16px 18px; border: 1px solid var(--line); }
.dlg h2 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0 0 8px; }
.dlist { display: grid; gap: 8px; margin: 10px 0; }
.ditem { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 6px; background: var(--bg); }
.ditem img { width: 76px; height: 56px; object-fit: cover; border-radius: 6px; background: var(--sunk); }
.ditem small { color: var(--muted); display: block; font-size: 11.5px; }
.menu { position: absolute; z-index: 70; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 220px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px; }
.menu button:hover { background: var(--sunk); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 90; font-size: 13px; max-width: calc(100% - 32px); }
table.cut { width: 100%; border-collapse: collapse; font-size: 12px; }
table.cut th, table.cut td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.cut th { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
table.cut td.r, table.cut th.r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 0; border-top: 2px solid var(--ink); margin-top: 8px; flex-wrap: wrap; }
.total b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.rate { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; font-size: 12.5px; }
.rate input { width: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; text-align: right; background: var(--bg); font-family: var(--f-mono); }

@media (max-width: 900px) {
  #app { height: auto; min-height: 100%; grid-template-rows: auto auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { order: 1; height: 50vh; min-height: 300px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .rail { order: 2; flex-direction: row; overflow-x: auto; gap: 2px; }
  .rail button { min-width: 62px; }
  .panel { order: 3; overflow: visible; }
  .stagebar input[type=range] { width: 80px; }
  .lib-detail { grid-template-columns: 88px minmax(0, 1fr); }
  .lib-detail .big { width: 88px; height: 88px; }
  .lib-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
  .lib-detail { max-height: 38vh; }
  .lib-filters { max-height: 22vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand">Almari Studio<small>WARDROBE DESIGNER</small></div>
    <input id="dname" aria-label="Design name" value="Master bedroom wardrobe" maxlength="60">
    <div class="tb">
      <button class="btn small" id="bUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg>Undo</button>
      <button class="btn small" id="bRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h2"/></svg>Redo</button>
      <div class="seg" role="group" aria-label="Units"><button data-unit="mm">mm</button><button data-unit="cm">cm</button><button data-unit="ft">ft-in</button></div>
      <button class="btn small" id="bLib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Finishes</button>
      <button class="btn small" id="bDesigns">Designs</button>
      <button class="btn small" id="bExport">Export</button>
      <button class="btn small primary" id="bSave">Save</button>
    </div>
  </header>
  <main class="work">

function pairs(it) {

  const target = l > 0.6 ? 0.32 : 0.62;
  const warm = (h < 70 || h > 330) && s > 0.08;
  const pool = woods.filter((x) => (warm ? /Walnut|Teak|Oak|Sheesham/ : /Oak|Ash|Walnut|Elm|Birch/).test(x.name)).sort((a, b) => Math.abs(a.L - target) - Math.abs(b.L - target));
  const spec = new Set();
  take(pool.filter((x) => { const sp = x.name.split(' ').slice(1).join(' '); if (spec.has(sp)) return false; spec.add(sp); return true; }), isWood ? 1 : 2);
  const solids = CAT.filter((x) => ['VT', 'CM'].includes(x.coll));
  take(solids.filter((x) => x.H[1] < 0.12 && Math.abs(x.L - it.L) > 0.35).sort((a, b) => b.L - a.L), 1);
  take(solids.filter((x) => x.H[1] < 0.12 && Math.abs(x.L - it.L) > 0.35).sort((a, b) => a.L - b.L), 1);
  if (!isWood && s > 0.06) take(CAT.filter((x) => x.coll === it.coll && x !== it && Math.abs(((x.H[0] - h + 540) % 360) - 180) < 10 && Math.abs(x.L - l) > 0.12 && Math.abs(x.L - l) < 0.35), 1);
  const comp = (h + 180) % 360;
  take(solids.filter((x) => x.H[1] > 0.1 && x.H[1] < 0.35 && Math.abs(((x.H[0] - comp + 540) % 360) - 180) < 24 && Math.abs(x.L - (isWood ? 0.55 : l)) < 0.2).sort((a, b) => a.H[1] - b.H[1]), 1);
  if (isWood) take(CAT.filter((x) => x.coll === 'VT' && /Sage|Olive|Denim|Indigo|Terracotta|Mauve/.test(x.name) && x.L > 0.35 && x.L < 0.7), 3);
  take([pick('MW', warm || isWood ? 'Brushed Brass' : 'Brushed Stainless')], 1);
  take(CAT.filter((x) => x.coll === 'SM' && x.p.v === 0 && Math.abs(x.L - (l > 0.5 ? 0.85 : 0.2)) < 0.2), 1);
  take(CAT.filter((x) => x.coll === 'WH' && /cane|linen/.test(x.name) && /Natural|Ivory/.test(x.name)), 1);
  return out.slice(0, 10);
}

  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; store.set('almari-tab', tab);
  if (tab === 'interior') { if (view === 'front') setView('inside'); else if (view === '3d') { $('#openR').value = 1; } }
  renderPanel(); $('#panel').scrollTop = 0;
});
function bayTarget() { return S.bays[clamp(selBay, 0, S.bays.length - 1)]; }
function fillShelves(b) {
  const used = b.mods.reduce((a, m) => a + m.h, 0); let free = usable() - used;
  if (free < 150) return;
  const n = Math.max(1, Math.floor(free / 330)); const h = Math.floor(free / n);
  for (let i = 0; i < n - 1; i++) b.mods.push({ t: 'shelf', h });
}
$('#panel').addEventListener('click', (e) => {
  const st = e.target.closest('[data-step]');
  if (st) { const p = st.dataset.step; commit(() => setp(p, Math.max(0, get(p) + +st.dataset.d * stepOf(p))), 'step' + p); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, bay = bayTarget();
  const C = (fn, key) => commit(fn, key);
  switch (a) {
    case 'preset': C(() => { S.W = +b.dataset.w; const n = +b.dataset.b; while (S.bays.length < n) S.bays.push(JSON.parse(JSON.stringify(S.bays[S.bays.length % Math.max(1, S.bays.length)] || { w: 0, doors: 1, mods: [] }))); S.bays.length = n; evenBays(); }); break;
    case 'filltoceil': C(() => { const l = S.room.ceil - S.H; S.loftH = l >= 250 ? Math.min(1200, l) : 0; }); break;
    case 'baycount': C(() => { if (+b.dataset.d > 0) S.bays.push(JSON.parse(JSON.stringify(S.bays[S.bays.length - 1]))); else if (S.bays.length > 1) S.bays.pop(); S.bayStyle = {}; evenBays(); }); break;
    case 'evenbays': C(evenBays); break;
    case 'selbay': selBay = +b.dataset.i; selMod = -1; renderPanel(); renderElev(); break;
    case 'baydoors': C(() => (bay.doors = +b.dataset.n)); break;
    case 'tpl': C(() => { bay.mods = TEMPLATES[+b.dataset.i][1].map(([t, h]) => ({ t, h })); fillShelves(bay); }); selMod = -1; break;
    case 'selmod': if (e.target.closest('input,button')) break; selMod = +b.dataset.k; renderPanel(); renderElev(); break;
    case 'modup': C(() => { const k = +b.dataset.k; if (k < bay.mods.length - 1) { [bay.mods[k], bay.mods[k + 1]] = [bay.mods[k + 1], bay.mods[k]]; selMod = k + 1; } }); break;
    case 'moddown': C(() => { const k = +b.dataset.k; if (k > 0) { [bay.mods[k], bay.mods[k - 1]] = [bay.mods[k - 1], bay.mods[k]]; selMod = k - 1; } }); break;
    case 'moddel': C(() => { bay.mods.splice(+b.dataset.k, 1); selMod = -1; }); break;
    case 'addmod': C(() => {
      const t = b.dataset.t, m = { t, h: MODS[t].h };
      if (t === 'drawerX') { let k = 0; while (k < bay.mods.length && bay.mods[k].t === 'drawerX') k++; bay.mods.splice(k, 0, m); selMod = k; }
      else if (selMod >= 0 && selMod < bay.mods.length) { bay.mods.splice(selMod + 1, 0, m); selMod++; } else { bay.mods.push(m); selMod = bay.mods.length - 1; }
      const free = usable() - bay.mods.reduce((s, x) => s + x.h, 0);
      if (free < 0) { const sh = [...bay.mods].reverse().find((x) => x.t === 'shelf' && x !== m && x.h + free >= 150); if (sh) sh.h += free; }
    }); break;
    case 'fillshelves': C(() => fillShelves(bay)); break;
    case 'copyall': C(() => S.bays.forEach((x) => { if (x !== bay) x.mods = bay.mods.map((m) => ({ ...m })); })); toast('Copied to every bay.'); break;
    case 'clearbay': C(() => (bay.mods = [])); break;
    case 'ledk': C(() => (S.ledK = +b.dataset.k)); break;
    case 'type': C(() => { S.type = b.dataset.v; S.over = {}; }); break;
    case 'slide': C(() => (S.slide = +b.dataset.n)); break;
    case 'dstyle': C(() => (S.doorStyle = b.dataset.v)); break;
    case 'pattern': C(() => (S.pattern = b.dataset.v)); break;
    case 'clearover': C(() => (S.over = {})); break;
    case 'libfor': openLib(b.dataset.slot); break;
    case 'lib': openLib('main'); break;
    case 'libedit': openLib('main', { edit: b.dataset.k, coll: 'all', fam: null }); break;
    case 'libfloor': openLib('floor', { coll: 'all', edit: null }); break;
    case 'combo': { const c = COMBOS[+b.dataset.i], cc = comboCodes(c), o = c[4]; C(() => { S.mats = { ...S.mats, ...cc }; S.pattern = o.pattern; S.doorStyle = o.style || (['fluted', 'shaker'].includes(S.doorStyle) && !o.style ? 'flat' : S.doorStyle); S.accentStyle = o.accentStyle || null; S.handle.fin = o.handle; if (o.htype) S.handle.type = o.htype; else if (S.handle.type === 'gola') S.handle.type = 'bar'; S.over = {}; }); toast(`${c[0]} applied`); break; }
    case 'setaccent': C(() => { S.mats.accent = b.dataset.code; if (S.pattern === 'solid') S.pattern = 'center'; }); toast(`Accent: ${getIt(b.dataset.code).name}`); break;
    case 'upload': $('#fileTex').click(); break;
    case 'htype': C(() => (S.handle.type = b.dataset.v)); break;
    case 'hfin': C(() => (S.handle.fin = b.dataset.v)); break;
    case 'hloft': C(() => (S.handle.loft = b.dataset.v)); break;
    case 'align': C(() => (S.room.align = b.dataset.v)); break;
    case 'wall': C(() => (S.room.wall = b.dataset.v)); break;
    case 'bedfab': C(() => (S.room.bedFab = b.dataset.v)); break;
    case 'csv': saveFile(`${slug()}-cut-list.csv`, csv()); break;
    case 'resetrates': C(() => (S.rates = { ...RATES0 })); break;
  }
});
$('#panel').addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.bind) { let v = parseFloat(el.value); if (!isFinite(v)) { renderPanel(); return; } if (el.dataset.mm === '1') v = fromU(v); commit(() => setp(el.dataset.bind, Math.max(0, v))); return; }
  if (el.dataset.bindsel) { const v = el.value; commit(() => setp(el.dataset.bindsel, isFinite(+v) ? +v : v)); return; }
  if (el.dataset.bindchk) { commit(() => setp(el.dataset.bindchk, el.checked)); return; }
  if (el.dataset.rate) { const v = parseFloat(el.value); if (isFinite(v)) commit(() => (S.rates[el.dataset.rate] = Math.max(0, v))); return; }
  const a = el.dataset.act;
  if (a === 'bayw') { const v = parseFloat(el.value); if (isFinite(v)) commit(() => setBayWidth(selBay, fromU(v))); }
  else if (a === 'modh') { const v = parseFloat(el.value); const k = +el.dataset.k; if (isFinite(v)) commit(() => { const m = bayTarget().mods[k]; m.h = Math.max(MODS[m.t].min, Math.round(fromU(v))); }); }
  else if (a === 'accentstyle') commit(() => (S.accentStyle = el.value || null));
  else if (a === 'loftstyle') commit(() => (S.loftStyle = el.value));
  else if (a === 'baystyle') commit(() => { if (el.value) S.bayStyle[el.dataset.i] = el.value; else delete S.bayStyle[el.dataset.i]; });
  else if (a === 'hsize') commit(() => (S.handle.size = +el.value));
  else if (a === 'wallpick') commit(() => (S.room.wall = el.value));
});
$('#panel').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input')) e.target.blur(); });
$('#dname').addEventListener('change', (e) => commit(() => (S.name = e.target.value.trim() || 'Wardrobe'), 'name'));
$$('[data-unit]').forEach((b) => b.addEventListener('click', () => { S.unit = b.dataset.unit; store.set('almari-draft', S); $$('[data-unit]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.unit === S.unit)); renderPanel(); renderFoot(); renderElev(); }));
$$('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
$$('[data-light]').forEach((b) => b.addEventListener('click', () => { light = b.dataset.light; store.set('almari-light', light); scheduleBuild(); }));
$('#openR').addEventListener('input', () => { if (+$('#openR').value > 0.05 && !ledLights.length && S.led) scheduleBuild(); });
$('#bCam').addEventListener('click', () => frame());
$('#bShot').addEventListener('click', async () => { if (view === '3d') { const url = shot(2000); const blob = await (await fetch(url)).blob(); saveFile(`${slug()}.png`, blob); } else { try { saveFile(`${slug()}-${view}.png`, await svgPng(view === 'inside' ? 'inside' : 'front')); } catch { toast('Could not draw the picture here.'); } } });
$('#bUndo').addEventListener('click', undo); $('#bRedo').addEventListener('click', redo);
$('#bLib').addEventListener('click', () => openLib('main'));
$('#bDesigns').addEventListener('click', openDesigns);
$('#bExport').addEventListener('click', (e) => openExport(e.currentTarget));
$('#bSave').addEventListener('click', () => saveDesign(false));
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.target.matches('input,textarea')) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !e.target.matches('input,textarea')) { e.preventDefault(); redo(); }
  if (e.key === 'Escape') { if (libOpen) closeLib(); else if (brush) { brush = null; renderBrush(); } }
});
$('#elev').addEventListener('click', (e) => {
  const d = e.target.closest('[data-door]'); if (d) { pickDoor(d.dataset.door); renderElev(); return; }
  const m = e.target.closest('[data-bay]'); if (m) { selBay = +m.dataset.bay; selMod = +m.dataset.k; tab = 'interior'; store.set('almari-tab', tab); renderPanel(); renderElev(); }
});
$('.view').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'doorlib' && selDoor) openLib('door:' + selDoor);
  else if (a === 'doorreset' && selDoor) commit(() => delete S.over[selDoor]);
  else if (a === 'doorclose') { selDoor = null; scheduleBuild(); }
  else if (a === 'brushdone') { brush = null; renderBrush(); }
});
// library
let qT = 0;
$('#libQ').addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { lib.q = e.target.value; lib.shown = 120; renderLibGrid(); }, 140); });
$('#libFin').addEventListener('change', (e) => { lib.fin = e.target.value; lib.shown = 120; renderLibGrid(); });
$('#libSort').addEventListener('change', (e) => { lib.sort = e.target.value; lib.shown = 120; renderLibGrid(); });
$('#lib').addEventListener('click', (e) => {
  const c = e.target.closest('[data-lc]'); if (c) { lib.coll = c.dataset.lc; lib.shown = 120; renderLibChrome(); renderLibGrid(); return; }
  const ed = e.target.closest('[data-le]'); if (ed) { lib.edit = ed.dataset.le || null; lib.shown = 120; renderLibChrome(); renderLibGrid(); return; }
  const f = e.target.closest('[data-lf]'); if (f) { lib.fam = f.dataset.lf || null; lib.shown = 120; renderLibChrome(); renderLibGrid(); return; }
  const sw = e.target.closest('.swc'); if (sw) { lib.sel = sw.dataset.code; $$('.swc', $('#libGrid')).forEach((x) => x.setAttribute('aria-pressed', x === sw)); renderLibDetail(); if (e.detail === 2) applyLib(lib.target.startsWith('door:') ? lib.target : lib.target, lib.sel); return; }
  const p = e.target.closest('[data-lp]'); if (p) { lib.sel = p.dataset.lp; renderLibDetail(); return; }
  const la = e.target.closest('[data-la]');
  if (la) {
    const k = la.dataset.la, code = lib.sel;
    if (k === 'fav') { favs.has(code) ? favs.delete(code) : favs.add(code); store.set('almari-favs', [...favs]); renderLibDetail(); renderLibChrome(); return; }
    if (k === 'copy') { const it = BY.get(code); navigator.clipboard?.writeText(`${it.code} ${it.name} ${it.hex}`).then(() => toast('Copied.'), () => toast(`${it.code} · ${it.hex}`)); return; }
    if (k === 'door') { applyLib(lib.target, code); return; }
    applyLib(k, code); return;
  }
  if (e.target.closest('#libClose')) closeLib();
});
// files
$('#fileTex').addEventListener('change', (e) => {
  const f = e.target.files?.[0]; e.target.value = ''; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image(); im.onload = () => {
      const s = 384, c = document.createElement('canvas'), k = Math.min(1, s / Math.min(im.width, im.height));
      const cw = Math.round(Math.min(im.width * k, s)), ch = Math.round(Math.min(im.height * k, s)); c.width = cw; c.height = ch;
      const g = c.getContext('2d'); const sx = (im.width - cw / k) / 2, sy = (im.height - ch / k) / 2; g.drawImage(im, sx, sy, cw / k, ch / k, 0, 0, cw, ch);
      const px = g.getImageData(0, 0, cw, ch).data; let r = 0, gg = 0, b = 0, n = 0; for (let i = 0; i < px.length; i += 16) { r += px[i]; gg += px[i + 1]; b += px[i + 2]; n++; }
      const cust = store.get('almari-swatches', []);
      const code = `MY-${String(cust.length + 1 + Math.floor(Math.random() * 0)).padStart(3, '0')}${Date.now() % 1000}`;
      const entry = { code, name: (f.name.replace(/\.[^.]+$/, '') || 'My sample').slice(0, 40), src: c.toDataURL('image/jpeg', 0.85), hex: rgb2hex([r / n, gg / n, b / n]), tile: 300 };
      cust.push(entry); if (!store.set('almari-swatches', cust)) toast('Added for this session; this browser is too full to keep it.');
      registerCustom(entry); openLib(lib.target && !lib.target.startsWith('door:') ? lib.target : 'main', { coll: 'MY', sel: code, edit: null, fam: null }); toast('Sample added to My swatches.');
    }; im.src = fr.result;
  };
  fr.readAsDataURL(f);
});
$('#fileJson').addEventListener('change', (e) => { const f = e.target.files?.[0]; e.target.value = ''; if (!f) return; f.text().then((t) => loadDesign(t)); });

/* ═════════════════════════════ loop ═════════════════════════════ */
function resize() {
  const r = $('.view').getBoundingClientRect();
  renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false);
  camera.aspect = Math.max(1, r.width) / Math.max(1, r.height); camera.fov = camera.aspect < 0.9 ? 58 : 45; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('.view'));
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());
  if (view !== '3d' || document.hidden) return;
  const tgt = +$('#openR').value;
  if (Math.abs(openAmt - tgt) > 0.001) { openAmt += (tgt - openAmt) * Math.min(1, dt * 7); applyOpen(); }
  controls.update(); renderer.render(scene, camera);
}

/* ═════════════════════════════ boot ═════════════════════════════ */
buildCatalog();
function boot() {
  const d = store.get('almari-draft', null);
  S = DEF();
  if (d && d.bays) { try { S = { ...S, ...d, room: { ...S.room, ...d.room }, handle: { ...S.handle, ...d.handle }, mats: { ...S.mats, ...d.mats }, rates: { ...RATES0, ...d.rates } }; (S.custom || []).forEach(registerCustom); for (const k in S.mats) if (!BY.has(S.mats[k])) S.mats[k] = DEF().mats[k]; } catch { S = DEF(); } }
  normalize();
  $('#dname').value = S.name;
  $$('[data-unit]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.unit === S.unit));
  renderRail(); setView(view); resize(); changed(true); applyLight();
  loop(); connect();
  window.__almari = { get S() { return S; }, CAT, geo, estimate, openLib, setView, commit, frame };
}
boot();
