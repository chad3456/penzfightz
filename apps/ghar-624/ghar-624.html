<title>Ghar 624</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #eef0ec;
  --panel: #f8f9f6;
  --raise: #ffffff;
  --ink: #1d2626;
  --ink-2: #4c5857;
  --ink-3: #7c8786;
  --line: #d6dbd6;
  --accent: #0e7a73;
  --accent-ink: #ffffff;
  --accent-soft: #d5ece8;
  --warm: #b8641f;
  --stage: #dfe3de;
  --shadow: 0 1px 2px rgba(20, 30, 30, 0.08), 0 6px 20px rgba(20, 30, 30, 0.06);
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131818; --panel: #1a2020; --raise: #222a2a; --ink: #e6ecea; --ink-2: #b3bfbd; --ink-3: #85918f;
    --line: #2f3a39; --accent: #3cc2b6; --accent-ink: #062321; --accent-soft: #173936; --warm: #e39a5a; --stage: #0f1414;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131818; --panel: #1a2020; --raise: #222a2a; --ink: #e6ecea; --ink-2: #b3bfbd; --ink-3: #85918f;
  --line: #2f3a39; --accent: #3cc2b6; --accent-ink: #062321; --accent-soft: #173936; --warm: #e39a5a; --stage: #0f1414;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.3);
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; flex-direction: column; line-height: 1.1; min-width: max-content; }
.brand b { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.brand span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.rooms { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.rooms::-webkit-scrollbar { display: none; }
.rooms button { flex: none; padding: 7px 12px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.rooms button small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-left: 6px; }
.rooms button[aria-selected="true"] { background: var(--raise); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow); }
.acts { display: flex; gap: 6px; }
.btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.5; cursor: default; }

/* work area */
.work { flex: 1; min-height: 0; display: flex; }
.stage { position: relative; flex: 1; min-width: 0; background: var(--stage); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#plan { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--stage); }
.hud { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--raise) 88%, transparent); backdrop-filter: blur(6px); font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.roomtag { position: absolute; left: 14px; bottom: 12px; pointer-events: none; }
.roomtag h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 3vw, 34px); letter-spacing: -0.02em; color: var(--ink); text-shadow: 0 1px 0 color-mix(in srgb, var(--stage) 60%, transparent); }
.roomtag p { margin: 2px 0 0; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.hint { position: absolute; right: 14px; bottom: 12px; font-size: 12px; color: var(--ink-3); pointer-events: none; text-align: right; }

/* panel */
.panel { width: 400px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; overscroll-behavior: contain; }
.sec { border-bottom: 1px solid var(--line); }
.sec > summary { list-style: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px; cursor: pointer; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.sec > summary span { font-size: 12px; color: var(--ink-3); text-align: right; }
.sec > summary::after { content: '+'; font-family: var(--mono); color: var(--ink-3); margin-left: 6px; }
.sec[open] > summary::after { content: '–'; }
.sec .body { padding: 0 16px 16px; display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
.field > .lab em { font-style: normal; font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink-2); font-weight: 500; }
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.sw button { display: grid; gap: 4px; padding: 0 0 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); overflow: hidden; text-align: left; }
.sw button i { display: block; height: 38px; background-size: cover; background-position: center; border-bottom: 1px solid var(--line); }
.sw button span { font-size: 10.5px; line-height: 1.2; padding: 0 5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.sw button[aria-pressed="true"] span { color: var(--ink); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.cards button { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); text-align: left; display: grid; gap: 2px; }
.cards button b { font-weight: 600; font-size: 13px; }
.cards button span { font-size: 11.5px; color: var(--ink-3); line-height: 1.3; }
.cards button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--raise); font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rng { display: flex; align-items: center; gap: 10px; }
.rng input { flex: 1; accent-color: var(--accent); }
.rng output { font-family: var(--mono); font-size: 12.5px; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin: 0; }
.note b { color: var(--ink); }
.upload { display: flex; gap: 8px; align-items: center; }
.upload label { padding: 7px 10px; border: 1px dashed var(--line); border-radius: 8px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.est { display: grid; gap: 2px; font-size: 13px; }
.est div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.est div span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.est .tot { border-bottom: 0; font-weight: 600; padding-top: 8px; }

/* overlay */
.ov { position: fixed; inset: 0; background: rgba(10, 16, 16, 0.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { width: min(560px, 100%); max-height: min(86vh, 760px); overflow: auto; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 20px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet input[type="text"] { flex: 1; min-width: 180px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); }
.dlist { display: grid; gap: 8px; }
.ditem { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); }
.ditem img { width: 96px; height: 60px; object-fit: cover; border-radius: 6px; background: var(--stage); }
.ditem b { display: block; font-size: 14px; }
.ditem small { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.ditem .row { gap: 4px; }
.muted { color: var(--ink-3); font-size: 12.5px; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; font-size: 13px; z-index: 30; box-shadow: var(--shadow); }

@media (max-width: 820px) {
  .top { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
  .brand { order: 1; }
  .acts { order: 2; margin-left: auto; }
  .rooms { order: 3; flex-basis: 100%; }
  .work { flex-direction: column; }
  .stage { flex: none; height: 46%; }
  .panel { width: auto; flex: 1; border-left: 0; border-top: 1px solid var(--line); }
  .hint { display: none; }
  .roomtag h2 { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<div id="app">
  <header class="top">
    <div class="brand"><b>Ghar 624</b><span>2 BHK · 624 sq ft</span></div>
    <nav class="rooms" id="rooms" role="tablist" aria-label="Rooms"></nav>
    <div class="acts">
      <button class="btn" id="btnDesigns">Designs</button>
      <button class="btn primary" id="btnSave">Save</button>
    </div>
  </header>
  <main class="work">
    <section class="stage" id="stage" aria-label="3D view">
      <canvas id="gl"></canvas>
      <svg id="plan" hidden aria-label="Floor plan"></svg>
      <div class="hud">
        <div class="chips" id="views"></div>
        <div class="chips" id="toggles"></div>
      </div>
      <div class="roomtag"><h2 id="rtName">Living room</h2><p id="rtDims"></p></div>
      <div class="hint" id="hint">Drag to look around · Dollhouse to see the whole room</div>
    </section>
    <aside class="panel" id="panel" aria-label="Design options"></aside>
  </main>
</div>

function marbleDraw(base, vein, seed) {

    g.globalAlpha = 1;

}

}
function openSave() {
  const inp = h('input', { type: 'text', id: 'designName', value: `Design ${new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}`, 'aria-label': 'Design name' });
  const ov = h('div', { class: 'ov', onclick: (e) => { if (e.target === ov) ov.remove(); } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-label': 'Save design' }, h('h3', {}, 'Save this design'),
      h('p', { class: 'muted' }, db ? 'Saved designs are kept with this page, so you can open them on your phone or laptop, and anyone you share the page with can see them.' : 'This design will be kept in this browser.'),
      h('div', { class: 'row' }, inp, h('button', { class: 'btn primary', onclick: async (e) => { e.currentTarget.disabled = true; if (await saveDesign(inp.value.trim() || 'Untitled')) ov.remove(); else e.currentTarget.disabled = false; } }, 'Save'), h('button', { class: 'btn', onclick: () => ov.remove() }, 'Cancel'))));
  document.body.append(ov); inp.select(); inp.focus();
}
function openDesigns() {
  const list = h('div', { class: 'dlist' });
  const ov = h('div', { class: 'ov', onclick: (e) => { if (e.target === ov) ov.remove(); } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-label': 'Saved designs' }, h('h3', {}, 'Saved designs'), list,
      h('div', { class: 'row' }, h('button', { class: 'btn', id: 'btnReset', onclick: () => { if (confirmReset(ov)) ov.remove(); } }, 'Start over from the sample'), h('button', { class: 'btn', onclick: () => ov.remove() }, 'Close'))));
  const fill = () => {
    list.innerHTML = '';
    const all = [...designs.map((d) => ({ ...d, where: 'library' })), ...localDesigns().map((d) => ({ ...d, where: 'device' }))];
    if (!all.length) list.append(h('p', { class: 'muted' }, 'Nothing saved yet. Press Save to keep the current look, then try something different and save again to compare.'));
    for (const d of all) {
      const pending = { v: false };
      const del = h('button', { class: 'btn', onclick: async () => {
        if (!pending.v) { pending.v = true; del.textContent = 'Really delete?'; return; }
        if (d.where === 'library' && db) { try { await db.collection('designs').doc(d.id).delete(); } catch { toast('Could not delete it. Try again.'); } }
        else store.set('ghar624-designs', localDesigns().filter((x) => x.id !== d.id));
        fill();
      } }, 'Delete');
      list.append(h('div', { class: 'ditem' }, d.thumb ? h('img', { src: d.thumb, alt: '' }) : h('img', { alt: '' }),
        h('div', {}, h('b', {}, d.name || 'Untitled'), h('small', {}, `${new Date(d.savedAt).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} · ${d.where === 'library' ? 'all devices' : 'this device'}`)),
        h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: () => { S = merged(d.state); store.set('ghar624-draft', S); ov.remove(); go(d.room && ROOMS.some((r) => r.id === d.room) ? d.room : current); toast(`Opened “${d.name}”.`); } }, 'Open'), del)));
    }
  };
  fill(); ov.userData = fill; document.body.append(ov);
  openList = fill;
}
let openList = null;
function confirmReset(ov) {
  const btn = ov.querySelector('#btnReset');
  if (btn.dataset.sure) { S = clone(DEFAULT); store.set('ghar624-draft', S); go(current); toast('Back to the sample design.'); return true; }
  btn.dataset.sure = '1'; btn.textContent = 'Replace the current design with the sample?'; return false;
}
async function savePicture() {
  if (!downloads) return;
  renderer.render(scene, camera);
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    try { await downloads.save({ filename: `ghar-624-${current}.png`, data: blob }); }
    catch (e) { if (e && e.code !== 'declined') toast('Could not save the picture here.'); }
  }, 'image/png');
}
async function connect() {
  if (!window.claude || !window.claude.use) return;
  try { downloads = await window.claude.use('downloads'); } catch { downloads = null; }
  renderHud();
  try { db = await window.claude.use('db'); } catch { db = null; }
  if (!db) return;
  try {
    unsub = db.collection('designs').orderBy('savedAt', 'desc').limit(60).onSnapshot((snap) => { designs = snap.docs.map((d) => ({ id: d.id, ...d.data() })); if (openList && document.querySelector('.ov')) openList(); }, () => { db = null; });
  } catch { db = null; }
}
window.addEventListener('pagehide', () => unsub && unsub());

/* ───────────────────────────── loop ───────────────────────────── */
function resize() {
  const r = $('#stage').getBoundingClientRect();
  renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false);
  camera.aspect = Math.max(1, r.width) / Math.max(1, r.height); camera.fov = r.width < r.height ? 72 : 62; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('#stage'));
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());
  if (current === 'plan') return;
  controls.update();
  if (fanOn) for (const s of spinners) s.rotation.y += dt * 9;
  const t = clock.elapsedTime;
  for (const f of flames) f.scale.y = 1.6 + Math.sin(t * 17 + f.position.x * 40) * 0.25;
  if (popGroup) popGroup.visible = camera.position.y < roomH - 0.02;
  renderer.render(scene, camera);
}

$('#btnSave').addEventListener('click', openSave);
$('#btnDesigns').addEventListener('click', openDesigns);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { applyLight(); if (current === 'plan') drawPlan(); });
document.fonts?.load('600 40px "Noto Sans Devanagari"').catch(() => {}).finally(() => { canvases.delete('om'); texBase.delete('om'); if (S.mandir.place === current) buildRoom(current); });
renderHud();
resize();
go(current);
loop();
connect();
</script>
